const textEl = document.getElementById("text");
const playBtn = document.getElementById("play");
// [ref] segments have no audio: they are shown but skipped during playback
const audios = SEGMENTS.map(s => (s.audio ? new Audio(s.audio) : null));
const nextVoiced = from => audios.findIndex((a, i) => a && i >= from);
let cur = nextVoiced(0), playing = false, lit = null;

SEGMENTS.forEach((seg, si) => {
  if (seg.heading) {
    const h = document.createElement("h2");
    h.className = "page-h";
    h.textContent = seg.heading;
    textEl.append(h);
  }
  const p = document.createElement("p");
  p.lang = seg.lang;
  if (seg.style === "ref") {
    p.className = "ref";
    p.textContent = seg.text;
    textEl.append(p);
    return;
  }
  p.className = "seg " + seg.lang + (seg.style === "h" ? " h" : "");
  seg.words.forEach(w => {
    w.el = document.createElement("span");
    w.el.textContent = w.w;
    w.el.onclick = () => seek(si, w.s);
    p.append(w.el, " ");
  });
  textEl.append(p);
});

audios.forEach((a, i) => a && a.addEventListener("ended", () => {
  const next = nextVoiced(i + 1);
  if (next >= 0) {
    cur = next;
    audios[cur].currentTime = 0;
    audios[cur].play();
  } else {
    stop();
    setLit(null);
    cur = nextVoiced(0);
  }
}));

function setLit(el) {
  if (lit === el) return;
  if (lit) lit.classList.remove("on");
  lit = el;
  if (el) el.classList.add("on");
}

function play() { playing = true; audios[cur].play(); playBtn.textContent = "❚❚ Pause"; }
function stop() { playing = false; audios[cur].pause(); playBtn.textContent = "▶ Play"; }
function seek(si, t) { audios[cur].pause(); cur = si; audios[cur].currentTime = t; play(); }

playBtn.onclick = () => (playing ? stop() : play());
document.getElementById("restart").onclick = () => { stop(); setLit(null); seek(nextVoiced(0), 0); };

(function tick() {
  if (playing) {
    const t = audios[cur].currentTime;
    let hit = null;
    for (const w of SEGMENTS[cur].words) { if (w.s <= t) hit = w; else break; }
    setLit(hit && hit.el);
  }
  requestAnimationFrame(tick);
})();
</script>
