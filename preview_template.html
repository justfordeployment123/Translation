<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Preview: {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Inter:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee; --panel: #fffdf9; --ink: #1d1a16; --muted: #6f675d; --line: #e3dcd1;
    --accent: #2f6b4f; --check: #fff1d6; --check-ink: #7a4b00; --fix: #e7f0fb; --fix-ink: #1f4f86;
    --ui: "Inter", system-ui, sans-serif; --urdu: "Noto Nastaliq Urdu", serif; --arabic: "Amiri", serif; --en: "Lora", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14120f; --panel: #1c1a16; --ink: #ece6dc; --muted: #a39a8d; --line: #34302a;
      --accent: #7cc4a0; --check: #3a2c12; --check-ink: #f3c879; --fix: #172638; --fix-ink: #9cc3ef;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14120f; --panel: #1c1a16; --ink: #ece6dc; --muted: #a39a8d; --line: #34302a;
    --accent: #7cc4a0; --check: #3a2c12; --check-ink: #f3c879; --fix: #172638; --fix-ink: #9cc3ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .nav { display: flex; gap: 6px; align-items: center; }
  button, select, input { font: inherit; font-size: .88rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  input[type=number] { width: 5.5em; }
  select { max-width: min(46ch, 100%); }
  .toggles { display: flex; gap: 12px; font-size: .85rem; color: var(--muted); }
  .toggles label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  section > .label { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .scan img { width: 100%; height: auto; border-radius: 6px; display: block; background: #fff; }
  .scan .none { color: var(--muted); font-size: .9rem; }
  .ur { direction: rtl; text-align: right; }
  .ur .b { font-family: var(--urdu); font-size: 1.12rem; line-height: 2.35; margin: 0 0 12px; }
  .ur .h { font-family: var(--urdu); font-weight: 600; font-size: 1.28rem; line-height: 2.3; margin: 6px 0 12px; color: var(--accent); }
  .ar { font-family: var(--arabic); font-size: 1.42rem; line-height: 2; margin: 0 0 12px; direction: rtl; text-align: right; }
  .ref { font-family: var(--arabic); font-size: .98rem; color: var(--muted); margin: -6px 0 14px; direction: rtl; text-align: right; }
  .en .b { font-family: var(--en); font-size: 1.02rem; line-height: 1.7; margin: 0 0 12px; }
  .en .h { font-family: var(--en); font-weight: 500; font-size: 1.15rem; margin: 6px 0 12px; color: var(--accent); }
  .en .ar { font-size: 1.3rem; }
  .fn { font-size: .9rem; color: var(--muted); border-inline-start: 3px solid var(--line); padding-inline-start: 10px; margin: -4px 0 14px; }
  .ur .fn { font-family: var(--urdu); line-height: 2.2; }
  .en .fn { font-family: var(--en); line-height: 1.6; }
  .notes { grid-column: 1 / -1; }
  .notes ul { margin: 0; padding-left: 18px; font-size: .86rem; line-height: 1.6; }
  .notes li { margin: 2px 0; }
  .notes li.check { background: var(--check); color: var(--check-ink); border-radius: 6px; padding: 2px 6px; list-style-position: inside; margin-left: -18px; }
  .notes li.fix { background: var(--fix); color: var(--fix-ink); border-radius: 6px; padding: 2px 6px; list-style-position: inside; margin-left: -18px; }
  .notes .empty { color: var(--muted); font-size: .86rem; }
  .hidden { display: none !important; }
  .keys { font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>{{HEADING}} <span>· text preview (no audio yet)</span></h1>
  <div class="nav">
    <button id="prev" title="Previous page (←)">‹ Prev</button>
    <input id="num" type="number" min="1" aria-label="Book page">
    <button id="next" title="Next page (→)">Next ›</button>
    <span class="count" id="count"></span>
  </div>
  <select id="toc" aria-label="Contents"></select>
  <div class="toggles">
    <label><input type="checkbox" data-panel="scan" checked> Scan</label>
    <label><input type="checkbox" data-panel="ur" checked> Urdu</label>
    <label><input type="checkbox" data-panel="en" checked> English</label>
    <label><input type="checkbox" data-panel="notes" checked> Notes</label>
  </div>
  <button id="theme" title="Light / dark">◐</button>
  <span class="keys">← → to turn pages</span>
</header>
<main id="main">
  <section class="scan" data-panel="scan"><div class="label">Scan</div><div id="scan"></div></section>
  <section class="ur" data-panel="ur"><div class="label" style="direction:ltr;text-align:left">Urdu</div><div id="ur"></div></section>
  <section class="en" data-panel="en"><div class="label">English</div><div id="en"></div></section>
  <section class="notes" data-panel="notes"><div class="label">Page notes (from the page file's header)</div><div id="notes"></div></section>
</main>
<script id="data" type="application/json">{{DATA}}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const P = DATA.pages;
let i = 0;
const $ = id => document.getElementById(id);
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function block(tag, text, side) {
  const el = document.createElement(tag === "h" || tag === "hen" ? "h3" : "p");
  el.textContent = text;
  el.className = tag === "ar" ? "ar" : tag === "ref" ? "ref" : (tag === "fn" || tag === "fen") ? "fn" : (tag === "h" || tag === "hen") ? "h" : "b";
  return el;
}

function render() {
  const p = P[i];
  $("num").value = p.n;
  $("count").textContent = `${i + 1} / ${P.length}`;
  $("scan").innerHTML = "";
  if (p.scan) {
    const img = new Image(); img.src = p.scan; img.alt = `Scan of book page ${p.n}`; img.loading = "lazy";
    $("scan").appendChild(img);
  } else {
    $("scan").innerHTML = '<div class="none">No scan for this page.</div>';
  }
  for (const side of ["ur", "en"]) {
    const box = $(side); box.innerHTML = "";
    if (!p[side].length) { box.innerHTML = '<p class="b" style="color:var(--muted)">—</p>'; continue; }
    for (const [tag, text] of p[side]) box.appendChild(block(tag, text, side));
  }
  const notes = $("notes"); notes.innerHTML = "";
  const lines = p.notes;
  if (!lines.length) { notes.innerHTML = '<div class="empty">No notes.</div>'; }
  else {
    const ul = document.createElement("ul");
    for (const l of lines) {
      const li = document.createElement("li"); li.textContent = l;
      if (/Proofreader please check/.test(l)) li.className = "check";
      else if (/^Print (typo|slip|spelling)/.test(l)) li.className = "fix";
      ul.appendChild(li);
    }
    notes.appendChild(ul);
  }
  let t = -1;
  DATA.toc.forEach((e, k) => { if (e.i <= i) t = k; });
  $("toc").value = t >= 0 ? String(t) : "";
  history.replaceState(null, "", `#${p.n}`);
  store("preview-page-" + DATA.book, String(p.n));
  window.scrollTo({ top: 0 });
}

function go(k) { i = Math.max(0, Math.min(P.length - 1, k)); render(); }
function goNumber(n) {
  let k = P.findIndex(p => p.n >= n);
  if (k < 0) k = P.length - 1;
  go(k);
}

const sel = $("toc");
sel.appendChild(new Option("Contents…", ""));
DATA.toc.forEach((e, k) => sel.appendChild(new Option(`${P[e.i].n} · ${e.en || e.ur}`, String(k))));
sel.addEventListener("change", () => { if (sel.value !== "") go(DATA.toc[+sel.value].i); });
$("prev").onclick = () => go(i - 1);
$("next").onclick = () => go(i + 1);
$("num").addEventListener("change", () => goNumber(+$("num").value));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") go(i + 1);
  if (e.key === "ArrowLeft") go(i - 1);
});

function layout() {
  const shown = [...document.querySelectorAll(".toggles input")].filter(c => c.checked).map(c => c.dataset.panel);
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("hidden", !shown.includes(s.dataset.panel)));
  const cols = ["scan", "ur", "en"].filter(x => shown.includes(x)).length || 1;
  $("main").style.setProperty("--cols", cols);
  store("preview-panels", shown.join(","));
}
const saved = load("preview-panels");
if (saved) document.querySelectorAll(".toggles input").forEach(c => c.checked = saved.split(",").includes(c.dataset.panel));
document.querySelectorAll(".toggles input").forEach(c => c.addEventListener("change", layout));
layout();

$("theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
  store("preview-theme", r.dataset.theme);
};
const th = load("preview-theme"); if (th) document.documentElement.dataset.theme = th;

const start = parseInt(location.hash.slice(1)) || parseInt(load("preview-page-" + DATA.book)) || P[0].n;
goNumber(start);
</script>
</body>
</html>
