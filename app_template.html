<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noor">
<meta name="description" content="Islamic books read aloud in Urdu and English, with the text highlighted as it is read.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #170f14; --bg-2: #1d131a; --surface: #241820; --surface-2: #2e2029; --line: #3a2832; --line-2: #4c3441;
    --ink: #fbeef3; --ink-2: #e7d0d9; --muted: #ad94a0; --faint: #7d6670;
    --pink: #f4a6bf; --pink-2: #ff8db0; --rose: #c2577d; --hl: rgba(255, 141, 176, .3);
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --urdu: "Noto Nastaliq Urdu", serif; --arabic: "Amiri Quran", serif;
    --app: 480px; --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
    --tab-h: 64px; --player-h: 150px; --fs: 1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #0d080b; color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
  button, select, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  [hidden] { display: none !important; }

  /* The app is a phone-width column; on a large screen it sits centred like a device. */
  .app { position: relative; max-width: var(--app); margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg);
         padding-bottom: calc(var(--tab-h) + var(--bottom)); }
  .app.reading { padding-bottom: calc(var(--tab-h) + var(--player-h) + var(--bottom)); }
  @media (min-width: 560px) { .app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .6); } }
  .dock { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--app); z-index: 40; }

  /* ---------- App bar ---------- */
  .appbar { position: sticky; top: 0; z-index: 30; padding-top: var(--top); background: rgba(23, 15, 20, .88); backdrop-filter: blur(16px) saturate(140%);
            border-bottom: 1px solid transparent; transition: border-color .2s; }
  .appbar.scrolled { border-bottom-color: var(--line); }
  .appbar .row { height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .appbar h1 { flex: 1; margin: 0; font-size: 1.08rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--pink-2), var(--rose)); color: #2a0f1b; font-size: 17px; flex: none; }
  .brand b { font-family: "Playfair Display", serif; font-size: 1.12rem; font-weight: 700; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; font-size: 18px; color: var(--ink-2); flex: none; }
  .iconbtn:active { transform: scale(.94); }
  .langpill { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); flex: none; }
  .langpill button { border: 0; background: none; padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--muted); }
  .langpill button.on { background: var(--pink); color: #2a0f1b; }
  .langpill .u { font-family: var(--urdu); font-weight: 600; line-height: 1.3; padding-top: 3px; }

  .screen { padding: 8px 16px 24px; animation: in .22s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .h2 { font-size: 1.05rem; font-weight: 700; margin: 26px 2px 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .h2 a { font-size: .82rem; font-weight: 600; color: var(--pink); }

  /* ---------- Covers ---------- */
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 5px 12px 12px 5px; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
           align-items: center; text-align: center; padding: 14% 10% 14% 15%; color: #fff;
           box-shadow: inset 6px 0 0 rgba(0, 0, 0, .25), inset 8px 0 0 rgba(255, 255, 255, .06), 0 10px 26px rgba(0, 0, 0, .45); }
  .cover::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: var(--pattern); background-size: 40px 40px; }
  .cover::after { content: ""; position: absolute; inset: 8% 7% 8% 12%; border: 1px solid rgba(255, 255, 255, .28); border-radius: 4px; }
  .cover .t { position: relative; z-index: 1; font-family: var(--urdu); font-weight: 700; font-size: 1em; line-height: 2; text-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .cover .a { position: relative; z-index: 1; font-family: var(--urdu); font-size: .48em; line-height: 2; opacity: .85; }
  .cover .orn { position: relative; z-index: 1; width: 34%; height: 1px; background: rgba(255, 255, 255, .5); margin: .3em 0; }
  .cover.mini { padding: 0; } .cover.mini .t, .cover.mini .a, .cover.mini .orn, .cover.mini::after { display: none; }
  .badge { position: absolute; z-index: 2; top: 8px; inset-inline-end: 8px; font-size: .58rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
           padding: 3px 7px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; }
  .badge.new { background: var(--pink-2); color: #2a0f1b; }

  /* ---------- Home ---------- */
  .greet { margin: 14px 2px 4px; color: var(--muted); font-size: .9rem; }
  .title-xl { font-family: "Playfair Display", serif; font-size: 1.7rem; font-weight: 700; margin: 0 2px; line-height: 1.25; }
  .continue { margin-top: 18px; display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; padding: 16px; border-radius: 20px;
              background: radial-gradient(120% 140% at 100% 0%, rgba(194, 87, 125, .35), transparent 60%), linear-gradient(160deg, var(--surface-2), var(--surface));
              border: 1px solid var(--line); cursor: pointer; }
  .continue .cover { font-size: 13px; }
  .continue small { color: var(--pink); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .continue b { display: block; font-family: var(--urdu); font-size: 1.15rem; line-height: 2; font-weight: 700; margin-top: 2px; }
  .continue .sub { color: var(--muted); font-size: .82rem; }
  .continue .prog { height: 4px; border-radius: 2px; background: var(--line-2); margin: 12px 0 10px; overflow: hidden; }
  .continue .prog div { height: 100%; background: linear-gradient(90deg, var(--pink), var(--pink-2)); }
  .continue .go { display: inline-flex; align-items: center; gap: 8px; background: var(--pink); color: #2a0f1b; font-weight: 700; font-size: .85rem; padding: 8px 14px; border-radius: 999px; }
  .continue .go svg { fill: currentColor; stroke: none; }
  .carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 4px 16px 10px; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .book { flex: 0 0 112px; scroll-snap-align: start; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 10px; text-align: center; }
  .tile .ic { width: 38px; height: 38px; margin: 0 auto 8px; border-radius: 12px; display: grid; place-items: center; background: rgba(244, 166, 191, .12); color: var(--pink); font-size: 18px; }
  .tile b { display: block; font-size: .8rem; line-height: 1.5; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 1.25rem; font-weight: 700; }
  .stat span { color: var(--muted); font-size: .74rem; }

  /* ---------- Library ---------- */
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; height: 46px; margin-top: 8px; color: var(--muted); }
  .search input { flex: 1; border: 0; background: none; outline: none; color: var(--ink); height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 14px; margin-top: 16px; }
  @media (min-width: 420px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .book { all: unset; cursor: pointer; display: block; font-size: 17px; }
  .book .cover { transition: transform .15s; }
  .book:active .cover { transform: scale(.97); }
  .book.soon .cover { filter: saturate(.35) brightness(.62); }
  .book .info { margin-top: 9px; font-size: 1rem; }
  .book .info b { display: block; font-family: var(--urdu); font-weight: 600; font-size: .88rem; line-height: 1.9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book .info span { color: var(--muted); font-size: .74rem; }

  /* ---------- Reader ---------- */
  .page-chip { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; color: var(--muted); font-size: .8rem; }
  .page-chip b { color: var(--ink-2); font-weight: 600; }
  .paper { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 22px; padding: 22px 18px 26px; min-height: 55vh; }
  .text[hidden] { display: none; }
  .seg { margin: 0 0 20px; }
  .seg.ar { font-family: var(--arabic); font-size: calc(1.55rem * var(--fs)); line-height: 2.2; color: var(--pink-2); direction: rtl; text-align: center;
            padding: 10px 12px; background: rgba(255, 141, 176, .05); border-radius: 14px; border: 1px solid rgba(255, 141, 176, .12); }
  .seg.ur { font-family: var(--urdu); font-size: calc(1.14rem * var(--fs)); line-height: 2.65; color: var(--ink); direction: rtl; text-align: justify; text-align-last: right; }
  .seg.en { font-family: "Lora", Georgia, serif; font-size: calc(1.06rem * var(--fs)); line-height: 1.85; color: var(--ink); direction: ltr; text-align: left; }
  .seg.h { font-weight: 700; color: var(--pink); text-align: center; text-align-last: center; font-size: calc(1.32rem * var(--fs)); margin: 4px 0 18px; }
  .seg.en.h { font-family: "Playfair Display", serif; }
  .seg span { border-radius: 6px; padding: 0 2px; transition: background .15s, color .15s; }
  .seg span.on { background: var(--hl); color: #fff; }
  .ref { font-family: var(--urdu); font-size: .78rem; line-height: 2.2; color: var(--muted); margin: -10px 0 20px; direction: rtl; text-align: center; }
  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .pager button { height: 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .88rem; }
  .pager button:disabled { opacity: .35; }

  /* ---------- Player (above the tab bar) ---------- */
  .player { bottom: calc(var(--tab-h) + var(--bottom)); background: rgba(29, 19, 26, .97); backdrop-filter: blur(18px); border-top: 1px solid var(--line); padding: 10px 16px 8px; }
  .np { display: flex; align-items: center; gap: 12px; }
  .np .cover { width: 34px; font-size: 6px; flex: none; box-shadow: inset 3px 0 0 rgba(0,0,0,.25), 0 4px 10px rgba(0,0,0,.4); }
  .np .txt { flex: 1; min-width: 0; }
  .np b { display: block; font-size: .86rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np span { display: block; color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .speed { height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; font-size: .78rem; font-weight: 700; cursor: pointer; color: var(--ink-2); flex: none; }
  .timeline { direction: ltr; display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 8px; margin-top: 10px; font-size: .7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .timeline span:last-child { text-align: right; }
  .bar { position: relative; height: 4px; border-radius: 2px; background: var(--line-2); cursor: pointer; touch-action: none; }
  .bar::before { content: ""; position: absolute; inset: -12px 0; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--pink), var(--pink-2)); }
  .bar .knob { position: absolute; top: 50%; left: 0; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(255, 141, 176, .25); }
  .transport { direction: ltr; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding: 0 6px; }
  .tbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; font-size: 22px; color: var(--ink-2); }
  .tbtn:active { background: var(--surface); }
  .tbtn:disabled { opacity: .3; }
  .play { width: 56px; height: 56px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 24px;
          background: linear-gradient(135deg, var(--pink-2), var(--pink)); color: #2a0f1b; box-shadow: 0 8px 22px rgba(255, 141, 176, .35); }
  .play:active { transform: scale(.95); }
  .play svg { fill: currentColor; stroke: none; }

  /* ---------- Tab bar ---------- */
  .tabbar { bottom: 0; height: calc(var(--tab-h) + var(--bottom)); padding-bottom: var(--bottom); background: rgba(20, 13, 17, .98); backdrop-filter: blur(18px);
            border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--faint); font-size: .68rem; font-weight: 600; }
  .tab svg { font-size: 22px; }
  .tab.on { color: var(--pink); }
  .tab .u { font-family: var(--urdu); font-size: .7rem; line-height: 1.5; font-weight: 600; }

  /* ---------- Sheets ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { bottom: 0; z-index: 70; max-height: 82vh; overflow: auto; background: var(--bg-2); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0;
           padding: 8px 16px calc(20px + var(--bottom)); transform: translate(-50%, 105%); transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .sheet.show { transform: translate(-50%, 0); }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 2px 12px; font-size: 1rem; }
  .toc a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; color: var(--ink-2); font-size: .9rem; }
  .toc a.on { background: rgba(244, 166, 191, .12); color: var(--pink); }
  .toc a span:last-child { color: var(--faint); font-size: .76rem; white-space: nowrap; }
  .toc .u { font-family: var(--urdu); line-height: 2; }
  .pagegrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
  .pagegrid button { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .85rem; }
  .pagegrid button.on { background: var(--pink); color: #2a0f1b; border-color: var(--pink); }
  .scan-img { width: 100%; border-radius: 12px; background: #fff; display: block; }

  /* ---------- Settings ---------- */
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(244, 166, 191, .12); color: var(--pink); font-size: 17px; flex: none; }
  .item .lbl { flex: 1; min-width: 0; font-size: .92rem; font-weight: 600; }
  .seg-ctl { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; flex: none; }
  .seg-ctl button { border: 0; background: none; padding: 6px 10px; border-radius: 9px; cursor: pointer; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .seg-ctl button.on { background: var(--pink); color: #2a0f1b; }
  .item a.dl { color: var(--pink); font-size: 18px; }
  .btn { display: flex; width: 100%; justify-content: center; align-items: center; gap: 10px; height: 50px; border-radius: 16px; border: 0; cursor: pointer; font-weight: 700;
         background: linear-gradient(135deg, var(--pink-2), var(--pink)); color: #2a0f1b; margin-top: 12px; }
  .note { color: var(--muted); font-size: .8rem; line-height: 1.6; margin: 10px 4px 0; }
  .about { text-align: center; color: var(--faint); font-size: .76rem; margin-top: 26px; line-height: 1.8; }

  .speed, #setSpeed, #pageCount, .stat b { direction: ltr; unicode-bidi: isolate; }
  .toast { position: fixed; left: 50%; top: calc(70px + var(--top)); transform: translate(-50%, -8px); z-index: 90; background: var(--surface-2); border: 1px solid var(--line-2);
           padding: 10px 16px; border-radius: 12px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; font-size: .88rem; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Urdu mode ---------- */
  html[lang="ur"] .appbar h1, html[lang="ur"] .h2, html[lang="ur"] .title-xl, html[lang="ur"] .greet, html[lang="ur"] .continue small, html[lang="ur"] .continue .sub,
  html[lang="ur"] .continue .go, html[lang="ur"] .tile b, html[lang="ur"] .stat span, html[lang="ur"] .book .info span, html[lang="ur"] .page-chip, html[lang="ur"] .pager button,
  html[lang="ur"] .sheet h3, html[lang="ur"] .item .lbl, html[lang="ur"] .note, html[lang="ur"] .btn, html[lang="ur"] .badge, html[lang="ur"] .np b,
  html[lang="ur"] .search input, html[lang="ur"] .toast, html[lang="ur"] .about { font-family: var(--urdu); line-height: 2; letter-spacing: 0; text-transform: none; font-weight: 600; }
  html[lang="ur"] .title-xl { font-size: 1.45rem; line-height: 2.1; }
  html[lang="ur"] .h2 { margin-top: 20px; }
  html[lang="ur"] .np b { font-weight: 700; }
</style>
</head>

<script>
const BOOKS = {{BOOKS}};
const DOWNLOADS = {{DOWNLOADS}};
const $ = id => document.getElementById(id);
const UI = {
  ur: {

    page: "صفحہ", pages: "صفحات", hours: "گھنٹے", langs: "زبانیں", libHead: "کتب خانہ", seeAll: "سب دیکھیں", whyHead: "خصوصیات",
    t1: "الفاظ کی ہم آہنگی", t2: "اردو اور انگریزی", t3: "پرسکون رفتار", search: "کتاب تلاش کریں", soon: "جلد آ رہی ہے", available: "دستیاب",
    contents: "فہرست", allPages: "تمام صفحات", scan: "اصل صفحہ", prevPage: "پچھلا صفحہ", nextPage: "اگلا صفحہ", settings: "ترتیبات",
    sLang: "زبان", sSpeed: "رفتار", sSize: "متن کا سائز", dlHead: "ڈاؤن لوڈ", instHead: "ایپ انسٹال کریں",
    instText: "ایپ کو اپنے فون کی ہوم اسکرین پر رکھیں، یہ پوری اسکرین پر اپنے آئیکن کے ساتھ کھلے گی۔", installBtn: "انسٹال کریں",
    ios: "آئی فون: سفاری میں شیئر بٹن دبائیں، پھر Add to Home Screen منتخب کریں۔", about: "نور لائبریری · اہلِ خانہ کے لیے، غیر تجارتی استعمال",
    noEn: "اس کتاب کا انگریزی ترجمہ ابھی دستیاب نہیں",
  },
  en: {
    tabs: ["Home", "Library", "Reader", "Settings"], greet: "Assalamu alaikum", homeTitle: "What would you like to listen to today?", cont: "Continue", start: "Start", listen: "Listen",
    page: "Page", pages: "Pages", hours: "Hours", langs: "Languages", libHead: "Library", seeAll: "See all", whyHead: "Features",
    t1: "Word-by-word sync", t2: "Urdu & English", t3: "Relaxed pace", search: "Search books", soon: "Coming soon", available: "Available",
    contents: "Contents", allPages: "All pages", scan: "Original page", prevPage: "Previous", nextPage: "Next", settings: "Settings",
    sLang: "Language", sSpeed: "Reading speed", sSize: "Text size", dlHead: "Downloads", instHead: "Install the app",
    instText: "Add the app to your phone's home screen. It opens full screen, with its own icon.", installBtn: "Install",
    ios: "iPhone: tap the Share button in Safari, then choose Add to Home Screen.", about: "Noor Library · For family use, not for sale",
    noEn: "The English translation of this book is not available yet",
  },
};
const PAUSE = { normal: 650, ar: 900, h: 1100, page: 1600 };
const SPEEDS = [0.8, 0.85, 0.9, 1];
const SIZES = [.92, 1, 1.12, 1.25];
const COVERS = [["#c2577d", "#6b2a4b"], ["#8a3a6b", "#3e1a31"], ["#a65277", "#55253e"], ["#b8466f", "#5a1e38"], ["#7b3b5e", "#341827"]];
const PATTERN = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 46 46"><g fill="none" stroke="#fff" stroke-width="1"><path d="M23 4l5.4 13.6L42 23l-13.6 5.4L23 42l-5.4-13.6L4 23l13.6-5.4z"/><circle cx="23" cy="23" r="5"/></g></svg>')}")`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("noor:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("noor:" + k, JSON.stringify(v)); } catch (e) {} },
};
const audio = new Audio();
audio.preservesPitch = true;
let lang = store.get("lang", "ur"), book = null, edition = null, blocks = [], segStart = [];
let cur = -1, shown = -1, playing = false, lit = null, waitTimer = null, rate = store.get("rate", 0.9), size = store.get("size", 1);
let installEvent = null, current = null;
const T = k => UI[lang][k];
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2300); }
const available = BOOKS.map((b, i) => [b, i]).filter(([b]) => b.editions);

function cover(b, i, mini) {
  const [c1, c2] = COVERS[i % COVERS.length];
  const el = document.createElement("div");
  el.className = "cover" + (mini ? " mini" : "");
  el.style.background = `linear-gradient(155deg, ${c1}, ${c2})`;
  el.style.setProperty("--pattern", PATTERN);
  el.innerHTML = `<span class="t"></span>${b.author ? '<span class="orn"></span><span class="a"></span>' : ""}`;
  el.querySelector(".t").textContent = b.title;
  if (b.author) el.querySelector(".a").textContent = b.author;
  return el;
}
function bookTile(b, i) {
  const el = document.createElement("button");
  el.className = "book" + (b.editions ? "" : " soon");
  const cv = cover(b, i);
  const badge = document.createElement("span");
  badge.className = "badge" + (b.editions ? " new" : "");
  badge.textContent = b.editions ? T("available") : T("soon");
  cv.append(badge); el.append(cv);
  const info = document.createElement("div");
  info.className = "info"; info.innerHTML = "<b></b><span></span>";
  info.querySelector("b").textContent = b.title;
  info.querySelector("span").textContent = b.editions ? (lang === "en" ? b.en_title || b.subtitle : b.subtitle) : T("soon");
  el.append(info);
  el.dataset.search = `${b.title} ${b.subtitle || ""} ${b.en_title || ""}`.toLowerCase();
  el.onclick = () => (b.editions ? (location.hash = "#/read") : toast(T("soon")));
  return el;
}

/* ---------- Language-dependent rendering ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  $("langUr").classList.toggle("on", lang === "ur"); $("langEn").classList.toggle("on", lang === "en");
  document.querySelectorAll(".tab span").forEach((s, k) => { s.textContent = T("tabs")[k]; s.className = lang === "ur" ? "u" : ""; });
  $("greet").textContent = T("greet"); $("homeTitle").textContent = T("homeTitle");
  $("libHead").textContent = T("libHead"); $("seeAll").textContent = T("seeAll"); $("whyHead").textContent = T("whyHead");
  ["t1", "t2", "t3"].forEach(k => $(k).textContent = T(k));
  $("search").placeholder = T("search");
  $("tocHead").textContent = T("contents"); $("pagesHead").textContent = T("allPages"); $("scanHead").textContent = T("scan");
  $("pgPrev").textContent = T("prevPage"); $("pgNext").textContent = T("nextPage");
  ["sLang", "sSpeed", "sSize", "dlHead", "instHead", "instText"].forEach(k => $(k).textContent = T(k));
  $("installLbl").textContent = T("installBtn"); $("iosNote").textContent = T("ios"); $("about").textContent = T("about");
  document.querySelectorAll("#setLang button").forEach(b => b.classList.toggle("on", b.dataset.v === lang));
  renderHome(); renderLibrary(); renderSettings();
  if (current) titles(current);
}

function renderHome() {
  const [b, i] = available[0];
  const last = store.get("page:" + i, null), ed = b.editions.ur;
  const c = $("continueCard"); c.innerHTML = "";
  c.append(cover(b, i));
  const d = document.createElement("div");
  const pct = last !== null ? Math.round((last + 1) / ed.pages.length * 100) : 0;
  d.innerHTML = `<small></small><b></b><div class="sub"></div><div class="prog"><div style="width:${pct}%"></div></div><span class="go"><svg><use href="#i-play"/></svg><span></span></span>`;
  d.querySelector("small").textContent = last !== null ? T("cont") : T("listen");
  d.querySelector("b").textContent = b.title;
  d.querySelector(".sub").textContent = last !== null ? `${T("page")} ${ed.pages[last]?.number} · ${pct}%` : (lang === "en" ? b.en_author : b.author);
  d.querySelector(".go span").textContent = last !== null ? T("cont") : T("start");
  c.append(d);
  c.onclick = () => (location.hash = "#/read");
  const hours = (Object.values(b.editions).reduce((s, e) => s + e.seconds, 0) / 3600).toFixed(1);
  $("stats").innerHTML = `<div class="stat"><b>${ed.pages.length}</b><span>${T("pages")}</span></div><div class="stat"><b>${hours}</b><span>${T("hours")}</span></div><div class="stat"><b>${Object.keys(b.editions).length}</b><span>${T("langs")}</span></div>`;
  $("carousel").innerHTML = "";
  BOOKS.slice(0, 8).forEach((bk, k) => $("carousel").append(bookTile(bk, k)));
}
function renderLibrary() { $("shelf").innerHTML = ""; BOOKS.forEach((b, i) => $("shelf").append(bookTile(b, i))); }
$("search").oninput = () => {
  const q = $("search").value.trim().toLowerCase();
  document.querySelectorAll("#shelf .book").forEach(el => el.hidden = !!q && !el.dataset.search.includes(q));
};
function renderSettings() {
  $("setSpeed").innerHTML = ""; $("setSize").innerHTML = "";
  SPEEDS.forEach(s => { const b = document.createElement("button"); b.textContent = s + "×"; b.classList.toggle("on", s === rate); b.onclick = () => setRate(s); $("setSpeed").append(b); });
  SIZES.forEach((v, k) => { const b = document.createElement("button"); b.textContent = "A"; b.style.fontSize = (.68 + k * .13) + "rem"; b.classList.toggle("on", v === size); b.onclick = () => setSize(v); $("setSize").append(b); });
  $("dlList").innerHTML = "";
  DOWNLOADS.forEach(([label, href]) => {
    const it = document.createElement("div");
    it.className = "item";
    it.innerHTML = `<span class="ic"><svg><use href="#i-head"/></svg></span><span class="lbl"></span><a class="dl" download href="${href}" aria-label="Download"><svg><use href="#i-download"/></svg></a>`;
    it.querySelector(".lbl").textContent = label;
    it.querySelector(".lbl").style.fontFamily = /[؀-ۿ]/.test(label) ? "var(--urdu)" : "var(--ui)";
    $("dlList").append(it);
  });
  $("speedBtn").textContent = rate + "×";
}
function setRate(s) { rate = s; audio.playbackRate = rate; store.set("rate", rate); renderSettings(); if (edition && shown >= 0) $("tAll").textContent = fmt(edition.pageSeconds[shown] / rate); }
function setSize(v) { size = v; store.set("size", v); document.documentElement.style.setProperty("--fs", v); renderSettings(); }
document.documentElement.style.setProperty("--fs", size);

/* ---------- Routing ---------- */
const SCREENS = { home: "screenHome", library: "screenLibrary", read: "screenRead", settings: "screenSettings" };
function route() {
  const r = (location.hash.replace(/^#\/?/, "").split("/")[0]) || "home";
  const name = SCREENS[r] ? r : "home";
  current = name;
  Object.entries(SCREENS).forEach(([k, id]) => $(id).hidden = k !== name);
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  const reading = name === "read";
  $("app").classList.toggle("reading", reading);
  $("player").hidden = !reading;
  $("tocBtn").hidden = !reading; $("scanBtn").hidden = !reading;
  closeSheets();
  if (reading && !book) openBook(available[0][1]);
  if (!reading) pause();
  if (name === "home") renderHome();
  titles(name);
  window.scrollTo({ top: 0 });
}
function titles(name) {
  $("brandRow").hidden = name !== "home";
  $("barTitle").hidden = name === "home";
  const readTitle = book ? (lang === "en" ? book.en_title || book.subtitle : book.title) : "";
  $("barTitle").textContent = name === "library" ? T("libHead") : name === "settings" ? T("settings") : name === "read" ? readTitle : "";
  $("barTitle").style.fontFamily = name === "read" && lang === "ur" ? "var(--urdu)" : "";
}
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => $("appbar").classList.toggle("scrolled", window.scrollY > 4), { passive: true });

/* ---------- Sheets ---------- */
function openSheet(id) { closeSheets(); $(id).classList.add("show"); $("scrim").classList.add("show"); }
function closeSheets() { document.querySelectorAll(".sheet").forEach(s => s.classList.remove("show")); $("scrim").classList.remove("show"); }
$("scrim").onclick = closeSheets;
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 70) closeSheets(); y0 = null; });
});
$("tocBtn").onclick = $("contentsBtn").onclick = () => openSheet("tocSheet");
$("scanBtn").onclick = () => openSheet("scanSheet");

/* ---------- Book and edition ---------- */
function openBook(i) {
  book = BOOKS[i];
  const c = cover(book, i, true); c.id = "npCover"; $("npCover").replaceWith(c);
  loadEdition(book.editions[lang] ? lang : "ur", store.get("page:" + i, 0));
}
function loadEdition(l, pageIndex) {
  const keepNumber = edition && shown >= 0 ? edition.pages[shown].number : null;
  stopAll();
  edition = book.editions[l];
  render();
  let p = pageIndex;
  if (p === undefined && keepNumber !== null) p = Math.max(0, edition.pages.findIndex(pg => pg.number === keepNumber));
  shown = -1;
  showPage(Math.min(p || 0, edition.pages.length - 1), false);
}
function render() {
  $("pages").innerHTML = ""; $("pageGrid").innerHTML = "";
  blocks = edition.pages.map((pg, p) => {
    const div = document.createElement("div"); div.className = "text"; div.hidden = true; $("pages").append(div);
    const b = document.createElement("button"); b.textContent = pg.number; b.onclick = () => { closeSheets(); goToPage(p); }; $("pageGrid").append(b);
    return div;
  });
  segStart = []; const acc = {};
  edition.segments.forEach((seg, si) => {
    const pg = seg.page || 0;
    segStart[si] = acc[pg] || 0; acc[pg] = (acc[pg] || 0) + (seg.d || 0);
    const p = document.createElement("p"); p.lang = seg.lang;
    if (seg.style === "ref") { p.className = "ref"; p.textContent = seg.text; }
    else {
      p.className = "seg " + seg.lang + (seg.style === "h" ? " h" : "");
      seg.words.forEach(w => { w.el = document.createElement("span"); w.el.textContent = w.w; w.el.onclick = () => seek(si, w.s, true); p.append(w.el, " "); });
    }
    blocks[pg].append(p);
  });
  edition.pageSeconds = edition.pages.map((_, p) => acc[p] || 0);
  $("tocList").innerHTML = "";
  edition.toc.forEach((t, k) => {
    const a = document.createElement("a"); a.href = "#/read";
    const next = edition.toc[k + 1];
    a.innerHTML = `<span></span><span>${T("page")} ${edition.pages[t.page].number}</span>`;
    a.firstChild.textContent = t.label;
    if (edition === book.editions.ur) a.firstChild.className = "u";
    a.dataset.page = t.page; a.dataset.end = next ? next.page : edition.pages.length;
    a.onclick = e => { e.preventDefault(); closeSheets(); goToPage(t.page); };
    $("tocList").append(a);
  });
}
const nextVoiced = from => edition.segments.findIndex((s, i) => s.audio && i >= from);
const firstOfPage = p => edition.segments.findIndex(s => (s.page || 0) === p);
function chapterOf(p) { let c = null; edition.toc.forEach(t => { if (t.page <= p) c = t; }); return c; }

function showPage(p, scroll) {
  if (p === shown) return;
  if (shown >= 0 && blocks[shown]) blocks[shown].hidden = true;
  shown = p; blocks[p].hidden = false;
  const pg = edition.pages[p], ch = chapterOf(p);
  $("pageTitle").textContent = `${T("page")} ${pg.number}`;
  $("pageCount").textContent = `${p + 1} / ${edition.pages.length}`;
  $("prev").disabled = $("pgPrev").disabled = p === 0;
  $("next").disabled = $("pgNext").disabled = p === edition.pages.length - 1;
  $("scanImg").src = pg.image || "";
  $("npTitle").textContent = `${T("page")} ${pg.number} · ${book.subtitle}`;
  $("npSub").textContent = ch ? ch.label : book.title;
  $("npSub").style.fontFamily = edition === book.editions.ur ? "var(--urdu)" : "";
  document.querySelectorAll("#tocList a").forEach(a => a.classList.toggle("on", p >= +a.dataset.page && p < +a.dataset.end));
  $("pageGrid").querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k === p));
  $("tAll").textContent = fmt(edition.pageSeconds[p] / rate);
  updateTime();
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
  store.set("page:" + BOOKS.indexOf(book), p);
}

/* ---------- Playback ---------- */
function setPlayIcon() { $("playIcon").innerHTML = `<use href="#i-${playing ? "pause" : "play"}"/>`; $("play").setAttribute("aria-label", playing ? "Pause" : "Play"); }
function load(si, t, autoplay) {
  clearTimeout(waitTimer);
  cur = si;
  showPage(edition.segments[si].page || 0, true);
  audio.src = edition.segments[si].audio; audio.playbackRate = rate;
  if (t > 0) audio.addEventListener("loadedmetadata", () => { audio.currentTime = t; }, { once: true });
  if (autoplay) play();
  const n = nextVoiced(si + 1);
  if (n >= 0) fetch(edition.segments[n].audio).catch(() => {});
}
function play() {
  if (cur < 0) { const si = nextVoiced(firstOfPage(shown)); if (si < 0) return; load(si, 0, false); }
  playing = true; audio.playbackRate = rate;
  audio.play().catch(() => stopAll());
  setPlayIcon();
  mediaSession();
}
function pause() { playing = false; clearTimeout(waitTimer); audio.pause(); setPlayIcon(); }
function stopAll() { pause(); setLit(null); cur = -1; }
function seek(si, t, autoplay) { audio.pause(); setLit(null); load(si, t, autoplay); }
function goToPage(p) {
  const si = nextVoiced(firstOfPage(p));
  if (playing && si >= 0) seek(si, 0, true); else { stopAll(); showPage(p, true); updateTime(); }
}
audio.addEventListener("ended", () => {
  const seg = edition.segments[cur], next = nextVoiced(cur + 1);
  if (next < 0) { stopAll(); return; }
  const wait = (edition.segments[next].page || 0) !== (seg.page || 0) ? PAUSE.page : seg.style === "h" ? PAUSE.h : seg.lang === "ar" ? PAUSE.ar : PAUSE.normal;
  waitTimer = setTimeout(() => { if (playing) load(next, 0, true); }, wait / rate);
});
function updateTime() {
  const total = edition.pageSeconds[shown] || 0;
  const now = cur >= 0 && (edition.segments[cur].page || 0) === shown ? segStart[cur] + (audio.currentTime || 0) : 0;
  const pct = total ? Math.min(100, now / total * 100) : 0;
  $("fill").style.width = pct + "%"; $("knob").style.left = pct + "%";
  $("tNow").textContent = fmt(now / rate);
}
$("bar").addEventListener("click", e => {
  const r = $("bar").getBoundingClientRect(), total = edition.pageSeconds[shown];
  const target = Math.min(Math.max(0, (e.clientX - r.left) / r.width), .999) * total;
  for (let si = firstOfPage(shown); si < edition.segments.length && (edition.segments[si].page || 0) === shown; si++) {
    const s = edition.segments[si];
    if (s.audio && target <= segStart[si] + s.d) { seek(si, Math.max(0, target - segStart[si]), true); return; }
  }
});
function setLit(el) {
  if (lit === el) return;
  if (lit) lit.classList.remove("on");
  lit = el;
  if (!el) return;
  el.classList.add("on");
  const r = el.getBoundingClientRect(), bottom = $("player").getBoundingClientRect().top - 16;
  if (r.top < 80 || r.bottom > bottom) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
function mediaSession() {
  if (!("mediaSession" in navigator) || !book) return;
  const pg = edition.pages[shown], ch = chapterOf(shown);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: `${book.title} · ${T("page")} ${pg.number}`, artist: lang === "en" ? book.en_author : book.author,
      album: ch ? ch.label : book.subtitle, artwork: [{ src: "icons/icon-512.png", sizes: "512x512", type: "image/png" }] });
    navigator.mediaSession.setActionHandler("play", play);
    navigator.mediaSession.setActionHandler("pause", pause);
    navigator.mediaSession.setActionHandler("previoustrack", () => $("prev").click());
    navigator.mediaSession.setActionHandler("nexttrack", () => $("next").click());
  } catch (e) {}
}

/* ---------- Controls ---------- */
$("play").onclick = () => (playing ? pause() : play());
$("restart").onclick = () => seek(nextVoiced(firstOfPage(shown)), 0, true);
$("prev").onclick = $("pgPrev").onclick = () => goToPage(Math.max(0, shown - 1));
$("next").onclick = $("pgNext").onclick = () => goToPage(Math.min(edition.pages.length - 1, shown + 1));
$("speedBtn").onclick = () => setRate(SPEEDS[(SPEEDS.indexOf(rate) + 1) % SPEEDS.length]);
function setLang(l) {
  if (book && !book.editions[l]) { toast(UI[l].noEn); return; }
  lang = l; store.set("lang", l);
  applyLang();
  if (book) loadEdition(l);
}
$("langUr").onclick = () => setLang("ur"); $("langEn").onclick = () => setLang("en");
document.querySelectorAll("#setLang button").forEach(b => b.onclick = () => setLang(b.dataset.v));
document.addEventListener("keydown", e => {
  if (current !== "read" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === "ArrowLeft") $(edition === book.editions.ur ? "next" : "prev").click();
  if (e.key === "ArrowRight") $(edition === book.editions.ur ? "prev" : "next").click();
});

/* ---------- Install as an app ---------- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvent = e; $("installBtn").hidden = false; });
$("installBtn").onclick = async () => { if (!installEvent) return; installEvent.prompt(); await installEvent.userChoice; installEvent = null; $("installBtn").hidden = true; };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

applyLang();
route();

(function tick() {
  if (playing && cur >= 0) {
    const t = audio.currentTime;
    let hit = null;
    for (const w of edition.segments[cur].words) { if (w.s <= t) hit = w; else break; }
    setLit(hit && hit.el);
    updateTime();
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
