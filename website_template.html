<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f14">
<meta name="description" content="Islamic books read aloud in Urdu and English, with the text highlighted as it is read.">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #170f14; --bg-2: #1e141a; --surface: #241820; --surface-2: #2d1f28; --line: #3a2832; --line-2: #4a3340;
    --ink: #fbeef3; --ink-2: #e9d3dc; --muted: #ad94a0; --faint: #7d6670;
    --pink: #f4a6bf; --pink-2: #ff8db0; --rose: #c2577d; --plum: #6b2a4b; --hl: rgba(255, 141, 176, .28);
    --radius: 16px; --shadow: 0 18px 50px rgba(0, 0, 0, .35); --player-h: 96px;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Playfair Display", Georgia, serif; --urdu: "Noto Nastaliq Urdu", serif; --arabic: "Amiri Quran", serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  body.reading { padding-bottom: calc(var(--player-h) + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  button, select { font: inherit; color: inherit; }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
  .ur-text { font-family: var(--urdu); }
  [hidden] { display: none !important; }

  /* ---------- Navigation ---------- */
  .nav { position: sticky; top: 0; z-index: 30; background: rgba(23, 15, 20, .82); backdrop-filter: saturate(140%) blur(14px);
         border-bottom: 1px solid var(--line); }
  .nav .wrap { height: 66px; display: flex; align-items: center; gap: 28px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .logo-mark { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
               background: linear-gradient(140deg, var(--pink-2), var(--rose)); color: #2a0f1b; font-size: 18px; }
  .logo b { font-family: var(--serif); font-size: 1.18rem; font-weight: 600; letter-spacing: .01em; }
  .logo small { display: block; font-family: var(--urdu); font-size: .72rem; color: var(--muted); line-height: 1.4; margin-top: -2px; }
  .nav-links { display: flex; gap: 6px; }
  .nav-links a { text-decoration: none; color: var(--muted); font-size: .92rem; font-weight: 500; padding: 8px 14px; border-radius: 999px; }
  .nav-links a:hover { color: var(--ink); background: var(--surface); }
  .nav-links a.on { color: var(--ink); background: var(--surface-2); }
  .nav-end { margin-inline-start: auto; display: flex; align-items: center; gap: 10px; }
  .seg-toggle { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .seg-toggle button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: .85rem; color: var(--muted); }
  .seg-toggle button.on { background: var(--pink); color: #2a0f1b; font-weight: 600; }
  .seg-toggle button:disabled { opacity: .4; cursor: default; }
  .seg-toggle .ur-label { font-family: var(--urdu); font-size: .82rem; line-height: 1.2; padding-top: 4px; }

  /* ---------- Buttons ---------- */
  .btn { display: inline-flex; align-items: center; gap: 9px; border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: .95rem;
         cursor: pointer; border: 1px solid transparent; text-decoration: none; transition: transform .15s, background .15s, border-color .15s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: linear-gradient(135deg, var(--pink-2), var(--pink)); color: #2a0f1b; box-shadow: 0 8px 24px rgba(255, 141, 176, .25); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: transparent; border-color: var(--line-2); color: var(--ink); }
  .btn-ghost:hover { background: var(--surface); }

  /* ---------- Covers ---------- */
  .cover { position: relative; aspect-ratio: 2 / 3; border-radius: 6px 14px 14px 6px; overflow: hidden; display: flex; flex-direction: column;
           justify-content: center; align-items: center; text-align: center; padding: 14% 10% 14% 14%; color: #fff;
           box-shadow: inset 7px 0 0 rgba(0, 0, 0, .25), inset 9px 0 0 rgba(255, 255, 255, .06), 0 14px 34px rgba(0, 0, 0, .45); }
  .cover::before { content: ""; position: absolute; inset: 0; opacity: .16; background-image: var(--pattern); background-size: 46px 46px; }
  .cover::after { content: ""; position: absolute; inset: 9% 8% 9% 12%; border: 1px solid rgba(255, 255, 255, .28); border-radius: 4px; }
  .cover .t { position: relative; z-index: 1; font-family: var(--urdu); font-weight: 700; font-size: 1.05em; line-height: 2; text-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
  .cover .a { position: relative; z-index: 1; font-family: var(--urdu); font-size: .5em; line-height: 2; opacity: .85; margin-top: .3em; }
  .cover .orn { position: relative; z-index: 1; width: 34%; height: 1px; background: rgba(255, 255, 255, .5); margin: .4em 0; }

  /* ---------- Home ---------- */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .hero::before { content: ""; position: absolute; inset: -40% -10% auto auto; width: 70vw; height: 70vw; max-width: 900px; max-height: 900px;
                  background: radial-gradient(closest-side, rgba(194, 87, 125, .32), transparent 70%); pointer-events: none; }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; align-items: center; padding-top: 72px; padding-bottom: 80px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
             color: var(--pink); background: rgba(244, 166, 191, .1); border: 1px solid rgba(244, 166, 191, .25); padding: 6px 12px; border-radius: 999px; }
  .hero h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2.2rem, 4.6vw, 3.6rem); line-height: 1.1; margin: 20px 0 10px; letter-spacing: -.01em; }
  .hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--pink-2), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .ur-line { font-family: var(--urdu); font-size: 1.35rem; color: var(--ink-2); line-height: 2.2; margin: 0 0 18px; }
  .hero p.lead { color: var(--muted); font-size: 1.08rem; line-height: 1.7; max-width: 560px; margin: 0 0 30px; }
  .hero .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero .stats { display: flex; gap: 34px; margin-top: 40px; }
  .hero .stats div b { display: block; font-family: var(--serif); font-size: 1.7rem; font-weight: 600; }
  .hero .stats div span { color: var(--muted); font-size: .85rem; }
  .hero-book { justify-self: center; width: min(320px, 72vw); font-size: clamp(30px, 5vw, 46px); transform: rotate(-3deg); }
  .hero-book .cover { box-shadow: inset 9px 0 0 rgba(0, 0, 0, .25), 0 40px 80px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .04); }

  section.block { padding: 64px 0; }
  .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
  .section-head h2 { font-family: var(--serif); font-weight: 600; font-size: 1.9rem; margin: 0; }
  .section-head p { margin: 6px 0 0; color: var(--muted); }

  .featured { display: grid; grid-template-columns: 220px 1fr; gap: 40px; align-items: center; background: linear-gradient(160deg, var(--surface-2), var(--surface));
              border: 1px solid var(--line); border-radius: 24px; padding: 34px; box-shadow: var(--shadow); }
  .featured .cover { font-size: 30px; }
  .featured h3 { margin: 0; font-family: var(--urdu); font-size: 1.9rem; line-height: 2; font-weight: 700; }
  .featured .sub { font-family: var(--serif); font-size: 1.25rem; color: var(--ink-2); margin: 2px 0 14px; }
  .featured .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--ink-2); background: var(--bg-2); border: 1px solid var(--line); padding: 6px 11px; border-radius: 999px; }
  .featured .by { color: var(--muted); font-size: .92rem; margin-bottom: 18px; }
  .featured .blurb { color: var(--ink-2); line-height: 1.7; margin: 0 0 24px; max-width: 640px; }
  .resume { color: var(--muted); font-size: .85rem; margin-top: 12px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 22px; }
  .book { all: unset; cursor: pointer; display: block; font-size: 22px; }
  .book:focus-visible { outline: 2px solid var(--pink); outline-offset: 6px; border-radius: 10px; }
  .book .cover { transition: transform .2s ease, box-shadow .2s ease; }
  .book:hover .cover { transform: translateY(-5px); }
  .book .info { margin-top: 14px; font-size: 1rem; }
  .book .info b { display: block; font-family: var(--urdu); font-weight: 600; font-size: .95rem; line-height: 1.9; }
  .book .info span { color: var(--muted); font-size: .8rem; }
  .book.soon .cover { filter: saturate(.35) brightness(.62); }
  .badge { position: absolute; z-index: 2; top: 10px; inset-inline-end: 10px; font-family: var(--ui); font-size: .62rem; font-weight: 700; letter-spacing: .08em;
           text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; }
  .badge.new { background: var(--pink-2); color: #2a0f1b; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .feature { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; }
  .feature .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(244, 166, 191, .12); color: var(--pink); font-size: 20px; margin-bottom: 16px; }
  .feature h4 { margin: 0 0 6px; font-size: 1.05rem; }
  .feature p { margin: 0; color: var(--muted); line-height: 1.6; font-size: .93rem; }

  footer { margin-top: auto; border-top: 1px solid var(--line); color: var(--faint); font-size: .85rem; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 26px; padding-bottom: 26px; }
  body.reading footer { display: none; }

  /* ---------- Reader ---------- */
  .reader-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; padding-top: 26px; padding-bottom: 40px; align-items: start; }
  .reader-layout.scan-on { grid-template-columns: 270px minmax(0, 1fr) minmax(0, .8fr); }
  .toc { position: sticky; top: 92px; max-height: calc(100vh - var(--player-h) - 120px); overflow: auto; background: var(--surface);
         border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .toc .book-mini { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: center; padding-bottom: 16px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .toc .book-mini .cover { font-size: 9px; box-shadow: inset 3px 0 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.4); }
  .toc .book-mini b { display: block; font-family: var(--urdu); font-size: .95rem; line-height: 1.9; }
  .toc .book-mini span { color: var(--muted); font-size: .78rem; }
  .toc h5 { margin: 6px 0 8px; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .toc a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-size: .88rem; line-height: 1.5; }
  .toc a:hover { background: var(--surface-2); }
  .toc a.on { background: rgba(244, 166, 191, .12); color: var(--pink); }
  .toc a span:last-child { color: var(--faint); font-size: .78rem; white-space: nowrap; }
  .toc a .ur-text { font-size: .86rem; line-height: 2; }

  .page-card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); min-height: 60vh; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 26px; border-bottom: 1px solid var(--line); }
  .page-head .crumb { color: var(--muted); font-size: .85rem; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .page-head .crumb b { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .page-head .tools { display: flex; gap: 6px; }
  .icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); cursor: pointer; font-size: 17px; color: var(--ink-2); }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.on { color: var(--pink); border-color: rgba(244, 166, 191, .4); }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .page-body { padding: 34px clamp(20px, 5vw, 64px) 42px; }
  .text[hidden] { display: none; }
  .seg { margin: 0 0 24px; }
  .seg.ar { font-family: var(--arabic); font-size: clamp(1.55rem, 3vw, 2.05rem); line-height: 2.25; color: var(--pink-2); direction: rtl; text-align: center;
            padding: 14px 18px; background: rgba(255, 141, 176, .05); border-radius: 14px; border: 1px solid rgba(255, 141, 176, .12); }
  .seg.ur { font-family: var(--urdu); font-size: clamp(1.12rem, 2.1vw, 1.36rem); line-height: 2.7; color: var(--ink); direction: rtl; text-align: justify; text-align-last: right; }
  .seg.en { font-family: "Lora", Georgia, serif; font-size: clamp(1.06rem, 1.9vw, 1.2rem); line-height: 1.9; color: var(--ink); direction: ltr; text-align: left; }
  .seg.h { font-weight: 700; color: var(--pink); text-align: center; text-align-last: center; font-size: clamp(1.3rem, 2.6vw, 1.65rem); margin: 6px 0 22px; }
  .seg.en.h { font-family: var(--serif); font-weight: 600; letter-spacing: .01em; }
  .seg span { border-radius: 6px; padding: 0 2px; cursor: pointer; transition: background .15s, color .15s; }
  .seg span:hover { background: rgba(255, 255, 255, .05); }
  .seg span.on { background: var(--hl); color: #fff; box-shadow: 0 0 0 1px rgba(255, 141, 176, .25); }
  .ref { font-family: var(--urdu); font-size: .8rem; line-height: 2.2; color: var(--muted); margin: -12px 0 24px; direction: rtl; text-align: center; }
  .page-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 26px; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
  .scan { position: sticky; top: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin: 0; }
  .scan img { width: 100%; height: auto; display: block; border-radius: 10px; background: #fff; }
  .scan figcaption { color: var(--muted); font-size: .78rem; padding: 10px 4px 2px; }

  /* ---------- Player ---------- */
  .player { position: fixed; inset: auto 0 0 0; z-index: 40; background: rgba(20, 13, 17, .94); backdrop-filter: blur(16px);
            border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .player .wrap { height: var(--player-h); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 20px; }
  .np { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .np .cover { width: 46px; font-size: 7px; flex: none; box-shadow: inset 3px 0 0 rgba(0,0,0,.25), 0 6px 14px rgba(0,0,0,.4); }
  .np .cover::after { display: none; }
  .np div { min-width: 0; }
  .np b { display: block; font-size: .93rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np span { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(560px, 46vw); }
  .transport { display: flex; align-items: center; gap: 14px; }
  .tbtn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 20px; }
  .tbtn:hover { color: var(--ink); background: var(--surface); }
  .tbtn:disabled { opacity: .3; cursor: default; background: none; }
  .play { width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-size: 22px;
          background: linear-gradient(135deg, var(--pink-2), var(--pink)); color: #2a0f1b; box-shadow: 0 8px 22px rgba(255, 141, 176, .35); }
  .play:hover { filter: brightness(1.06); }
  .play svg { fill: currentColor; stroke: none; }
  .timeline, .transport { direction: ltr; }
  .timeline { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; width: 100%; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .timeline span:last-child { text-align: right; }
  .bar { position: relative; height: 5px; border-radius: 3px; background: var(--line-2); cursor: pointer; }
  .bar::before { content: ""; position: absolute; inset: -8px 0; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--pink), var(--pink-2)); }
  .bar .knob { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); left: 0; opacity: 0; transition: opacity .15s; }
  .bar:hover .knob { opacity: 1; }
  .side { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .select { appearance: none; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; cursor: pointer; font-size: .85rem; }
  .menu-wrap { position: relative; }
  .menu { position: absolute; bottom: calc(100% + 12px); right: 0; min-width: 240px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 14px;
          padding: 8px; box-shadow: var(--shadow); }
  .menu a, .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--ink);
                          font-size: .9rem; border: 0; background: none; cursor: pointer; text-align: start; }
  .menu a:hover, .menu button:hover { background: rgba(244, 166, 191, .1); }
  .menu .ur-text { line-height: 2; }
  .menu h6 { margin: 6px 12px; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

  .toast { position: fixed; left: 50%; top: 84px; transform: translate(-50%, -10px); background: var(--surface-2); border: 1px solid var(--line-2); color: var(--ink);
           padding: 11px 18px; border-radius: 12px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Urdu mode ---------- */
  html[lang="ur"] .hero h1, html[lang="ur"] .section-head h2 { font-family: var(--urdu); font-weight: 700; line-height: 1.85; letter-spacing: 0; }
  html[lang="ur"] .hero h1 { font-size: clamp(2rem, 4vw, 3.1rem); margin-top: 26px; }
  html[lang="ur"] .section-head h2 { font-size: 1.7rem; }
  html[lang="ur"] .hero p.lead, html[lang="ur"] .section-head p, html[lang="ur"] .feature p, html[lang="ur"] .featured .by,
  html[lang="ur"] .resume, html[lang="ur"] .book .info span, html[lang="ur"] footer { font-family: var(--urdu); line-height: 2.2; }
  html[lang="ur"] .hero p.lead { font-size: 1.05rem; }
  html[lang="ur"] .feature h4, html[lang="ur"] .nav-links a, html[lang="ur"] .btn, html[lang="ur"] .eyebrow, html[lang="ur"] .chip,
  html[lang="ur"] .hero .stats span, html[lang="ur"] .badge, html[lang="ur"] .toc h5, html[lang="ur"] .page-foot, html[lang="ur"] .np b,
  html[lang="ur"] .menu h6, html[lang="ur"] .select { font-family: var(--urdu); line-height: 1.9; letter-spacing: 0; text-transform: none; }
  html[lang="ur"] .btn { padding: 9px 22px 13px; }
  html[lang="ur"] .eyebrow { padding: 4px 12px 8px; }
  html[lang="ur"] .hero .ur-line { display: none; }
  html[lang="ur"] .featured .sub { direction: ltr; text-align: right; }
  html[dir="rtl"] .toc a span:last-child { direction: rtl; }

  /* ---------- Small covers (player, contents): pattern only ---------- */
  .cover.mini { padding: 0; }
  .cover.mini .t, .cover.mini .a, .cover.mini .orn, .cover.mini::after { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) { .reader-layout.scan-on { grid-template-columns: 250px minmax(0, 1fr); } .reader-layout.scan-on .scan { grid-column: 2; position: static; } }
  @media (max-width: 900px) {
    .hero .wrap { grid-template-columns: 1fr; gap: 40px; padding-top: 44px; padding-bottom: 56px; }
    .hero-book { width: 210px; order: -1; }
    .features { grid-template-columns: 1fr; }
    .featured { grid-template-columns: 1fr; text-align: start; } .featured .cover { width: 170px; }
    .reader-layout, .reader-layout.scan-on { grid-template-columns: 1fr; }
    .toc { position: fixed; z-index: 50; inset: 66px auto calc(var(--player-h) + env(safe-area-inset-bottom)) 0; width: min(320px, 86vw); max-height: none;

<script>
const BOOKS = {{BOOKS}};
const DOWNLOADS = {{DOWNLOADS}};
const $ = id => document.getElementById(id);
const UI = {
  ur: {
    home: "صفحۂ اول", library: "کتب خانہ", read: "مطالعہ", page: "صفحہ", of: "از", contents: "فہرست", soon: "جلد آ رہی ہے", available: "دستیاب",
    start: "سننا شروع کریں", resume: "جاری رکھیں", browse: "تمام کتب دیکھیں", eyebrow: "آڈیو کتب · اردو اور انگریزی",
    heroTitle: "علم کو <em>سنیں</em>، الفاظ کے ساتھ ساتھ", heroLead: "معتبر اسلامی کتب، صاف آواز میں پڑھی ہوئی۔ ہر لفظ پڑھتے وقت نمایاں ہوتا ہے، اور صفحہ خود بخود پلٹتا ہے۔",
    pages: "صفحات", hours: "گھنٹے کی آڈیو", langs: "زبانیں", featTitle: "نمایاں کتاب", featSub: "ابھی سنیں — صفحہ بہ صفحہ، الفاظ کی ہم آہنگی کے ساتھ",
    libTitle: "کتب خانہ", libSub: "پندرہ کتب کا مجموعہ — نئی کتب جلد شامل ہوں گی", by: "مصنف", lastPage: "آخری بار صفحہ",
    f1t: "الفاظ کی ہم آہنگی", f1p: "آواز کے ساتھ ہر لفظ نمایاں ہوتا ہے، کسی بھی لفظ پر کلک کر کے وہیں سے سنیں۔",
    f2t: "اردو اور انگریزی", f2p: "ایک بٹن سے زبان بدلیں — آپ اسی صفحے پر رہتے ہیں۔",
    f3t: "پرسکون رفتار", f3p: "قدرتی وقفوں کے ساتھ پرسکون رفتار، اور اپنی پسند کی رفتار منتخب کریں۔",
    scan: "اصل صفحہ", download: "ڈاؤن لوڈ", noEn: "اس کتاب کا انگریزی ترجمہ ابھی دستیاب نہیں", foot: "اہلِ خانہ کے لیے، غیر تجارتی استعمال",
    speed: "رفتار",
  },
  en: {
    home: "Home", library: "Library", read: "Read", page: "Page", of: "of", contents: "Contents", soon: "Coming soon", available: "Available",
    start: "Start listening", resume: "Continue", browse: "Browse the library", eyebrow: "Audio books · Urdu & English",
    heroTitle: "<em>Listen</em> to knowledge, word by word", heroLead: "Trusted Islamic books, read aloud in a clear voice. Every word is highlighted as it is read, and pages turn on their own.",
    pages: "Pages", hours: "Hours of audio", langs: "Languages", featTitle: "Featured book", featSub: "Listen now, page by page, with the text in sync",
    libTitle: "Library", libSub: "A collection of fifteen books, with new titles on the way", by: "By", lastPage: "Last read: page",
    f1t: "Word-by-word sync", f1p: "Each word is highlighted as it is spoken. Tap any word to listen from there.",
    f2t: "Urdu and English", f2p: "Switch language with one tap and stay on the same page.",
    f3t: "A relaxed pace", f3p: "A calm reading pace with natural pauses, and your choice of speed.",
    scan: "Original page", download: "Download", noEn: "The English translation of this book is not available yet", foot: "For family use, not for sale",
    speed: "Speed",
  },
};
const PAUSE = { normal: 650, ar: 900, h: 1100, page: 1600 };
const SPEEDS = [0.8, 0.85, 0.9, 1.0];
const COVERS = [["#c2577d", "#6b2a4b"], ["#8a3a6b", "#3e1a31"], ["#a65277", "#55253e"], ["#b8466f", "#5a1e38"], ["#7b3b5e", "#341827"]];
const PATTERN = `url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46"><g fill="none" stroke="#fff" stroke-width="1"><path d="M23 4l5.4 13.6L42 23l-13.6 5.4L23 42l-5.4-13.6L4 23l13.6-5.4z"/><circle cx="23" cy="23" r="5"/></g></svg>')}")`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("noor:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("noor:" + k, JSON.stringify(v)); } catch (e) {} },
};
const audio = new Audio();
audio.preservesPitch = true;
let lang = store.get("lang", "ur"), book = null, edition = null, blocks = [], segStart = [];
let cur = -1, shown = -1, playing = false, lit = null, waitTimer = null, rate = store.get("rate", 0.9);
const T = k => UI[lang][k];
const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }

function coverHTML(b, i) {
  const [c1, c2] = COVERS[i % COVERS.length];
  const el = document.createElement("div");
  el.className = "cover";
  el.style.background = `linear-gradient(155deg, ${c1}, ${c2})`;
  el.style.setProperty("--pattern", PATTERN);
  el.innerHTML = `<span class="t"></span>${b.author ? '<span class="orn"></span><span class="a"></span>' : ""}`;
  el.querySelector(".t").textContent = b.title;
  if (b.author) el.querySelector(".a").textContent = b.author;
  return el;
}
const available = BOOKS.map((b, i) => [b, i]).filter(([b]) => b.editions);

/* ---------- Text that depends on the language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  $("langUr").classList.toggle("on", lang === "ur");
  $("langEn").classList.toggle("on", lang === "en");
  $("navHome").textContent = T("home"); $("navLib").textContent = T("library"); $("navRead").textContent = T("read");
  $("heroEyebrow").textContent = T("eyebrow"); $("heroTitle").innerHTML = T("heroTitle"); $("heroLead").textContent = T("heroLead");
  $("heroBrowse").textContent = T("browse");
  $("featTitle").textContent = T("featTitle"); $("featSub").textContent = T("featSub");
  $("libTitle").textContent = T("libTitle"); $("libSub").textContent = T("libSub");
  ["f1t", "f1p", "f2t", "f2p", "f3t", "f3p"].forEach(k => $(k).textContent = T(k));
  $("tocHead").textContent = T("contents"); $("footNote").textContent = T("foot");
  renderHome(); renderShelf(); renderDownloads(); speedOptions();
}

function bookStats(b) {
  const ed = b.editions.ur;
  return { pages: ed.pages.length, hours: (Object.values(b.editions).reduce((s, e) => s + e.seconds, 0) / 3600).toFixed(1), langs: Object.keys(b.editions).length };
}

function renderHome() {
  const [b, i] = available[0];
  const st = bookStats(b), last = store.get("page:" + i, null);
  $("heroCover").innerHTML = ""; $("heroCover").append(coverHTML(b, i));
  $("heroStart").querySelector("span").textContent = last !== null ? T("resume") : T("start");
  $("heroStats").innerHTML = `<div><b>${st.pages}</b><span>${T("pages")}</span></div><div><b>${st.hours}</b><span>${T("hours")}</span></div><div><b>${st.langs}</b><span>${T("langs")}</span></div>`;
  const f = $("featured"); f.innerHTML = "";
  f.append(coverHTML(b, i));
  const d = document.createElement("div");
  d.innerHTML = `<h3></h3><div class="sub"></div><div class="meta"></div><div class="by"></div><p class="blurb"></p><a class="btn btn-primary" href="#/read"><svg><use href="#i-play"/></svg><span></span></a><div class="resume"></div>`;
  d.querySelector("h3").textContent = b.title;
  d.querySelector(".sub").textContent = b.en_title ? `${b.subtitle} · ${b.en_title}` : b.subtitle;
  d.querySelector(".meta").innerHTML = `<span class="chip"><svg><use href="#i-book"/></svg>${st.pages} ${T("pages")}</span><span class="chip"><svg><use href="#i-clock"/></svg>${st.hours} ${T("hours")}</span><span class="chip"><svg><use href="#i-globe"/></svg>اردو · English</span>`;
  d.querySelector(".by").textContent = `${T("by")}: ${lang === "en" ? b.en_author : b.author}`;
  d.querySelector(".blurb").textContent = lang === "en" ? b.en_blurb : b.blurb;
  if (lang === "ur") d.querySelector(".blurb").classList.add("ur-text"), d.querySelector(".blurb").style.lineHeight = "2.3";
  d.querySelector(".btn span").textContent = last !== null ? T("resume") : T("start");
  if (last !== null) d.querySelector(".resume").textContent = `${T("lastPage")} ${b.editions.ur.pages[last]?.number ?? ""}`;
  f.append(d);
}

function renderShelf() {
  $("shelf").innerHTML = "";
  BOOKS.forEach((b, i) => {
    const el = document.createElement("button");
    el.className = "book" + (b.editions ? "" : " soon");
    const cov = coverHTML(b, i);
    const badge = document.createElement("span");
    badge.className = "badge" + (b.editions ? " new" : "");
    badge.textContent = b.editions ? T("available") : T("soon");
    cov.append(badge);
    el.append(cov);
    const info = document.createElement("div");
    info.className = "info";
    info.innerHTML = "<b></b><span></span>";
    info.querySelector("b").textContent = b.title;
    info.querySelector("span").textContent = b.editions ? (b.subtitle || "") : T("soon");
    el.append(info);
    el.onclick = () => (b.editions ? (location.hash = "#/read") : toast(T("soon")));
    $("shelf").append(el);
  });
}

function renderDownloads() {
  const m = $("dlMenu"); m.innerHTML = `<h6>${T("download")}</h6>`;
  DOWNLOADS.forEach(([label, href]) => {
    const a = document.createElement("a");
    a.href = href; a.download = "";
    a.innerHTML = `<svg><use href="#i-download"/></svg><span></span>`;
    a.querySelector("span").textContent = label;
    if (/[؀-ۿ]/.test(label)) a.querySelector("span").className = "ur-text";
    m.append(a);
  });
}
function speedOptions() {
  $("speed").innerHTML = "";
  SPEEDS.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = `${s}×`; $("speed").append(o); });
  $("speed").value = rate;
}

/* ---------- Routing ---------- */
function route() {
  const r = location.hash.replace(/^#\/?/, "").split("/")[0] || "home";
  const view = { home: "viewHome", library: "viewLibrary", read: "viewRead" }[r] || "viewHome";
  ["viewHome", "viewLibrary", "viewRead"].forEach(v => $(v).hidden = v !== view);
  document.querySelectorAll(".nav-links a").forEach(a => a.classList.toggle("on", a.dataset.route === r));
  const reading = view === "viewRead";
  document.body.classList.toggle("reading", reading);
  $("player").hidden = !reading;
  if (reading) { if (!book) openBook(available[0][1]); }
  else pause();
  if (!reading) window.scrollTo({ top: 0 });
}

/* ---------- Book and edition ---------- */
function openBook(i) {
  book = BOOKS[i];
  [$("tocCover"), $("npCover")].forEach(c => { const cv = coverHTML(book, i); cv.classList.add("mini"); c.replaceWith(cv); cv.id = c.id; });
  $("tocTitle").textContent = book.title;
  $("tocSub").textContent = book.subtitle;
  loadEdition(book.editions[lang] ? lang : "ur", store.get("page:" + i, 0));
}

function loadEdition(l, pageIndex) {
  const keepNumber = edition && shown >= 0 ? edition.pages[shown].number : null;
  stopAll();
  edition = book.editions[l];
  render();
  let p = pageIndex;
  if (p === undefined && keepNumber !== null) p = Math.max(0, edition.pages.findIndex(pg => pg.number === keepNumber));
  shown = -1;
  showPage(Math.min(p || 0, edition.pages.length - 1), false);
}

function render() {
  $("pages").innerHTML = ""; $("pick").innerHTML = "";
  blocks = edition.pages.map((pg, p) => {
    const div = document.createElement("div");
    div.className = "text"; div.hidden = true;
    $("pages").append(div);
    const o = document.createElement("option");
    o.value = p; o.textContent = `${T("page")} ${pg.number}`;
    $("pick").append(o);
    return div;
  });
  segStart = [];
  const acc = {};
  edition.segments.forEach((seg, si) => {
    const pg = seg.page || 0;
    segStart[si] = acc[pg] || 0;
    acc[pg] = (acc[pg] || 0) + (seg.d || 0);
    const p = document.createElement("p");
    p.lang = seg.lang;
    if (seg.style === "ref") { p.className = "ref"; p.textContent = seg.text; }
    else {
      p.className = "seg " + seg.lang + (seg.style === "h" ? " h" : "");
      seg.words.forEach(w => {
        w.el = document.createElement("span");
        w.el.textContent = w.w;
        w.el.onclick = () => seek(si, w.s, true);
        p.append(w.el, " ");
      });
    }
    blocks[pg].append(p);
  });
  edition.pageSeconds = edition.pages.map((_, p) => acc[p] || 0);
  // table of contents
  $("tocList").innerHTML = "";
  edition.toc.forEach((t, k) => {
    const a = document.createElement("a");
    a.href = "#/read";
    const next = edition.toc[k + 1];
    a.innerHTML = `<span></span><span>${T("page")} ${edition.pages[t.page].number}</span>`;
    a.firstChild.textContent = t.label;
    if (edition === book.editions.ur) a.firstChild.className = "ur-text";
    a.dataset.page = t.page;
    a.dataset.end = next ? next.page : edition.pages.length;
    a.onclick = e => { e.preventDefault(); goToPage(t.page); $("toc").classList.remove("open"); };
    $("tocList").append(a);
  });
}

const nextVoiced = from => edition.segments.findIndex((s, i) => s.audio && i >= from);
const firstOfPage = p => edition.segments.findIndex(s => (s.page || 0) === p);
function chapterOf(p) { let c = null; edition.toc.forEach(t => { if (t.page <= p) c = t; }); return c; }

function showPage(p, scroll) {
  if (p === shown) return;
  if (shown >= 0 && blocks[shown]) blocks[shown].hidden = true;
  shown = p;
  blocks[p].hidden = false;
  const pg = edition.pages[p], ch = chapterOf(p);
  const isUr = edition === book.editions.ur;
  $("pageTitle").textContent = `${T("page")} ${pg.number}`;
  $("pageCount").textContent = `${p + 1} / ${edition.pages.length}`;
  $("chapterName").textContent = ch ? ch.label : book.subtitle;
  $("chapterName").className = isUr && ch ? "ur-text" : "";
  $("pick").value = p;
  $("prev").disabled = p === 0;
  $("next").disabled = p === edition.pages.length - 1;
  $("scanImg").src = pg.image || "";
  $("scanCap").textContent = `${T("scan")} · ${T("page")} ${pg.number}`;
  $("npTitle").textContent = `${book.subtitle} · ${T("page")} ${pg.number}`;
  $("npSub").textContent = ch ? ch.label : book.title;
  document.querySelectorAll("#tocList a").forEach(a => a.classList.toggle("on", p >= +a.dataset.page && p < +a.dataset.end));
  $("tAll").textContent = fmt(edition.pageSeconds[p] / rate);
  updateTime();
  if (scroll) window.scrollTo({ top: 0, behavior: "smooth" });
  store.set("page:" + BOOKS.indexOf(book), p);
}

/* ---------- Playback ---------- */
function setPlayIcon() { $("playIcon").innerHTML = `<use href="#i-${playing ? "pause" : "play"}"/>`; $("play").setAttribute("aria-label", playing ? "Pause" : "Play"); }
function load(si, t, autoplay) {
  clearTimeout(waitTimer);
  cur = si;
  showPage(edition.segments[si].page || 0, true);
  audio.src = edition.segments[si].audio;
  audio.playbackRate = rate;
  if (t > 0) audio.addEventListener("loadedmetadata", () => { audio.currentTime = t; }, { once: true });
  if (autoplay) play();
  const n = nextVoiced(si + 1);
  if (n >= 0) fetch(edition.segments[n].audio).catch(() => {});
}
function play() {
  if (cur < 0) { const si = nextVoiced(firstOfPage(shown)); if (si < 0) return; load(si, 0, false); }
  playing = true;
  audio.playbackRate = rate;
  audio.play().catch(() => stopAll());
  setPlayIcon();
}
function pause() { playing = false; clearTimeout(waitTimer); audio.pause(); setPlayIcon(); }
function stopAll() { pause(); setLit(null); cur = -1; }
function seek(si, t, autoplay) { audio.pause(); setLit(null); load(si, t, autoplay); }
function goToPage(p) {
  const si = nextVoiced(firstOfPage(p));
  if (playing && si >= 0) seek(si, 0, true);
  else { stopAll(); showPage(p, true); updateTime(); }
}
audio.addEventListener("ended", () => {
  const seg = edition.segments[cur], next = nextVoiced(cur + 1);
  if (next < 0) { stopAll(); return; }
  const wait = (edition.segments[next].page || 0) !== (seg.page || 0) ? PAUSE.page : seg.style === "h" ? PAUSE.h : seg.lang === "ar" ? PAUSE.ar : PAUSE.normal;
  waitTimer = setTimeout(() => { if (playing) load(next, 0, true); }, wait / rate);
});

function updateTime() {
  const total = edition.pageSeconds[shown] || 0;
  const now = cur >= 0 && (edition.segments[cur].page || 0) === shown ? segStart[cur] + (audio.currentTime || 0) : 0;
  const pct = total ? Math.min(100, now / total * 100) : 0;
  $("fill").style.width = pct + "%"; $("knob").style.left = pct + "%";
  $("tNow").textContent = fmt(now / rate);
}
$("bar").addEventListener("click", e => {
  const r = $("bar").getBoundingClientRect(), total = edition.pageSeconds[shown];
  let target = (e.clientX - r.left) / r.width * total;
  for (let si = firstOfPage(shown); si < edition.segments.length && (edition.segments[si].page || 0) === shown; si++) {
    const s = edition.segments[si];
    if (!s.audio) continue;
    if (target <= segStart[si] + s.d) { seek(si, Math.max(0, target - segStart[si]), true); return; }
  }
});

function setLit(el) {
  if (lit === el) return;
  if (lit) lit.classList.remove("on");
  lit = el;
  if (!el) return;
  el.classList.add("on");
  const r = el.getBoundingClientRect(), bottom = window.innerHeight - $("player").offsetHeight - 20;
  if (r.top < 90 || r.bottom > bottom) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

/* ---------- Controls ---------- */
$("play").onclick = () => (playing ? pause() : play());
$("restart").onclick = () => seek(nextVoiced(firstOfPage(shown)), 0, true);
$("prev").onclick = () => goToPage(Math.max(0, shown - 1));
$("next").onclick = () => goToPage(Math.min(edition.pages.length - 1, shown + 1));
$("pick").onchange = () => goToPage(Number($("pick").value));
$("speed").onchange = () => { rate = Number($("speed").value); audio.playbackRate = rate; store.set("rate", rate); $("tAll").textContent = fmt(edition.pageSeconds[shown] / rate); };
$("scanBtn").onclick = () => { $("scan").hidden = !$("scan").hidden; $("layout").classList.toggle("scan-on", !$("scan").hidden); $("scanBtn").classList.toggle("on", !$("scan").hidden); };
$("tocBtn").onclick = () => $("toc").classList.toggle("open");
$("dlBtn").onclick = e => { e.stopPropagation(); $("dlMenu").hidden = !$("dlMenu").hidden; };
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) $("dlMenu").hidden = true; });
function setLang(l) {
  if (book && !book.editions[l]) { toast(UI[l].noEn); return; }
  lang = l; store.set("lang", l);
  applyLang();
  if (book) loadEdition(l);
}
$("langUr").onclick = () => setLang("ur");
$("langEn").onclick = () => setLang("en");
document.addEventListener("keydown", e => {
  if ($("viewRead").hidden || e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === "ArrowLeft") $(edition === book.editions.ur ? "next" : "prev").click();
  if (e.key === "ArrowRight") $(edition === book.editions.ur ? "prev" : "next").click();
});

$("year").textContent = new Date().getFullYear();
applyLang();
window.addEventListener("hashchange", route);
route();

(function tick() {
  if (playing && cur >= 0) {
    const t = audio.currentTime;
    let hit = null;
    for (const w of edition.segments[cur].words) { if (w.s <= t) hit = w; else break; }
    setLit(hit && hit.el);
    updateTime();
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
